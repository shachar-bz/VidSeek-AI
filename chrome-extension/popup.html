<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VidSeek</title>
    <link rel="stylesheet" href="/src/popup.css" />
  </head>
  <body>
    <main>
      <h1>VidSeek</h1>

      <section id="auth">
        <div id="auth-signed-in" hidden>
          <p id="auth-status"></p>
          <button id="auth-logout" class="secondary">Log out</button>
        </div>
        <form id="auth-form">
          <input id="auth-email" type="email" placeholder="Email" autocomplete="username" required />
          <input
            id="auth-display-name"
            type="text"
            placeholder="Name"
            autocomplete="name"
            hidden
          />
          <input
            id="auth-password"
            type="password"
            placeholder="Password"
            autocomplete="current-password"
            required
          />
          <p id="auth-error"></p>
          <button id="auth-submit" type="submit">Log in</button>
          <button id="auth-toggle" type="button" class="link">Need an account? Sign up</button>
        </form>
      </section>
      <hr />

      <p id="status">Inspect the active tab to find its video.</p>
      <progress id="progress" max="1" value="0"></progress>
      <div id="details"></div>
      <fieldset id="video-picker" hidden></fieldset>
      <button id="inspect">Inspect video</button>
      <button id="download" hidden>Grant access and download</button>
      <button id="verify" hidden>Verify & play</button>
      <button id="stop-verify" hidden>Finish verification</button>
      <button id="capture" hidden>Capture difficult player</button>
      <button id="stop-capture" hidden>Stop capture and retry</button>
      <button id="cancel" class="secondary" hidden>Cancel</button>
    </main>
    <script type="module" src="/src/popup.ts"></script>
  </body>
</html>
